<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Product Page</title>
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">PBT Store</a>
    <button class="menu-toggle" aria-label="Open menu">☰</button>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="page-layout">
    <aside class="sidebar">
      <h2>Filter</h2>
      <label><input type="checkbox" /> New arrivals</label>
      <label><input type="checkbox" /> Best sellers</label>
      <label><input type="checkbox" /> Sale</label>
    </aside>

    <section class="product-grid" aria-label="Product list">
      <article class="product-card"><img src="https://picsum.photos/seed/1/600/400" alt="Product 1"><h3>Product 1</h3><p>$19.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/2/600/400" alt="Product 2"><h3>Product 2</h3><p>$24.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/3/600/400" alt="Product 3"><h3>Product 3</h3><p>$29.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/4/600/400" alt="Product 4"><h3>Product 4</h3><p>$34.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/5/600/400" alt="Product 5"><h3>Product 5</h3><p>$39.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/6/600/400" alt="Product 6"><h3>Product 6</h3><p>$44.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/7/600/400" alt="Product 7"><h3>Product 7</h3><p>$49.99</p></article>
      <article class="product-card"><img src="https://picsum.photos/seed/8/600/400" alt="Product 8"><h3>Product 8</h3><p>$54.99</p></article>
    </section>

    <aside class="ads-bar">
      <h2>Ads</h2>
      <p>Promotional space</p>
    </aside>
  </main>

  <footer class="site-footer">© 2026 PBT Store</footer>
</body>
</html>
