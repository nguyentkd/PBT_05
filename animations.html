<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animations Demo</title>
  <link rel="stylesheet" href="animations.css" />
</head>
<body>
  <main class="demo-page">
    <section class="product-card">
      <div class="image-wrap">
        <img src="https://picsum.photos/seed/11/800/500" alt="Product">
      </div>
      <div class="card-body">
        <h2>Product name</h2>
        <p>Premium description text for the card.</p>
        <button class="buy-btn">Mua ngay</button>
      </div>
    </section>

    <section class="product-card">
      <div class="image-wrap">
        <img src="https://picsum.photos/seed/12/800/500" alt="Another product">
      </div>
      <div class="card-body">
        <h2>Another product</h2>
        <p>This card demonstrates hover, zoom and fade-in.</p>
        <button class="buy-btn">Mua ngay</button>
      </div>
    </section>

    <div class="spinner" aria-label="Loading"></div>

    <div class="fade-in">
      <h2>Fade in content</h2>
      <p>Nội dung này minh họa hiệu ứng xuất hiện mềm.</p>
    </div>
  </main>
</body>
</html>
